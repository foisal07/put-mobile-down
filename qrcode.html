<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="qr-page">
    <main class="qr-layout">
      <section class="slideshow" aria-label="Daydream previews">
        <img
          id="slideshow-image"
          src="https://media.istockphoto.com/id/1344461297/hu/vektor/hatalmas-elef%C3%A1nt-lebeg-vagy-rep%C3%BCl-l%C3%A9gg%C3%B6mbbel-%C3%A9g-%C3%A9s-felh%C5%91k-h%C3%A1tter%C3%A9vel-fantasztikus-sz%C3%BCrre%C3%A1lis.jpg?s=612x612&w=0&k=20&c=Ts8-lKcp5K2TGc8FFpE8r9WRrHDClEh55UsuvKdurS0="
          alt="Daydream preview"
        />
      </section>
      <section class="qr-panel qr-panel--binbag">
        <h2>SEAT ON ME TO DAYDREAM</h2>
        <img
          class="qr-binbag"
          src="binbag.png"
          alt="Bean bag inviting you to daydream"
        />
      </section>
    </main>
    <script src="qrcode.js"></script>
  </body>
</html>
