<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Put Your Phone Down - App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body class="app-page">
    <section class="ripple-section">
      <div id="ripple" class="ripples"></div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.ripples@0.6.3/dist/jquery.ripples.min.js"></script>
    <script>
      (function registerRipples() {
        var initialised = false;

        function init() {
          if (initialised) {
            return;
          }

          if (
            !window.jQuery ||
            !window.jQuery.fn ||
            typeof window.jQuery.fn.ripples !== "function"
          ) {
            console.warn("jQuery ripples plugin not available.");
            return;
          }

          var $ripple = window.jQuery("#ripple");

          if ($ripple.length === 0) {
            return;
          }

          var options = {
            resolution: 512,
            dropRadius: 20,
            perturbance: 0.01
          };

          try {
            $ripple.ripples(options);

            // Occasionally trigger random drops to keep the surface moving
            setInterval(function randomDrop() {
              if (!initialised) {
                return;
              }
              var width = $ripple.outerWidth();
              var height = $ripple.outerHeight();
              try {
                $ripple.ripples("drop", Math.random() * width, Math.random() * height, 20, 0.04);
              } catch (dropError) {
                console.warn("Ripple drop failed:", dropError);
              }
            }, 2800);

            initialised = true;
          } catch (error) {
            console.error("Failed to initialise ripples effect:", error);
          }
        }

        window.addEventListener("load", init, { once: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            init();
          }
        });
      })();
    </script>
  </body>
</html>
