    <script>
      (function registerRipples() {
        var initialised = false;

        function init() {
          if (initialised) {
            return;
          }

          if (
            !window.jQuery ||
            !window.jQuery.fn ||
            typeof window.jQuery.fn.ripples !== "function"
          ) {
            console.warn("jQuery ripples plugin not available.");
            return;
          }

          var $ripple = window.jQuery("#ripple");
          if ($ripple.length === 0) {
            return;
          }

          try {
            $ripple.ripples({
              resolution: 512,
              dropRadius: 20,
              perturbance: 0.01,
            });

            setInterval(function randomDrop() {
              if (!initialised) {
                return;
              }
              var width = $ripple.outerWidth();
              var height = $ripple.outerHeight();
              try {
                $ripple.ripples(
                  "drop",
                  Math.random() * width,
                  Math.random() * height,
                  16,
                  0.035
                );
              } catch (dropError) {
                console.warn("Ripple drop failed:", dropError);
              }
            }, 3200);

            initialised = true;
          } catch (error) {
            console.error("Failed to initialise ripples effect:", error);
          }
        }

        window.addEventListener("load", init, { once: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            init();
          }
        });
      })();
    </script>
    <!-- Water ripple audio -->
    <script>
      window.addEventListener("DOMContentLoaded", function rippleAudioController() {
        if (typeof Howl !== "function") {
          console.warn("Howler.js is not loaded; ripple audio disabled.");
          return;
        }

        const enableButton = document.getElementById("enable-audio");
        const rippleSound = new Howl({
          src: ["634753__thimblerig__slow-quiet-water-ripples-remix-of-338345.wav"],
          preload: true,
          loop: true,
          volume: 0,
          html5: true,
        });

        let pointerTracking = false;
        let audioStarted = false;
        let startInProgress = false;
        let soundId = null;
        let lastX = null;
        let lastY = null;
        let lastTime = null;
        let idleTimer = 0;
        let pauseTimeout = 0;

        const MAX_VOLUME = 0.95;
        const SPEED_TO_VOLUME = 0.0016; // maps px/sec to Howler volume
        const IDLE_TIMEOUT = 260;
        const PAUSE_FADE_MS = 180;

        function hideEnableButton() {
          if (!enableButton) return;
          enableButton.disabled = true;
          enableButton.textContent = "Sound enabled";
          enableButton.style.transition = "opacity 0.4s ease";
          enableButton.style.opacity = "0";
          window.setTimeout(() => {
            enableButton.style.pointerEvents = "none";
          }, 450);
        }

        function restoreEnableButton() {
          if (!enableButton) return;
          enableButton.disabled = false;
          enableButton.textContent = "Enable sound";
          enableButton.style.opacity = "1";
          enableButton.style.pointerEvents = "auto";
        }

        function ensureSoundPlaying() {
          if (!audioStarted) {
            return false;
          }
          if (soundId === null) {
            try {
              soundId = rippleSound.play();
            } catch (error) {
              console.warn("Ripple audio start failed:", error);
              return false;
            }
          }
          if (!rippleSound.playing(soundId)) {
            try {
              rippleSound.volume(0, soundId);
              rippleSound.play(soundId);
            } catch (error) {
              console.warn("Ripple audio resume failed:", error);
              return false;
            }
          }
          return true;
        }

        function pauseSound() {
          if (!audioStarted || soundId === null) {
            return;
          }
          const currentVolume = rippleSound.volume(soundId);
          rippleSound.fade(currentVolume, 0, PAUSE_FADE_MS, soundId);
          if (pauseTimeout) {
            clearTimeout(pauseTimeout);
          }
          pauseTimeout = window.setTimeout(() => {
            pauseTimeout = 0;
            if (!audioStarted || soundId === null) {
              return;
            }
            rippleSound.pause(soundId);
            rippleSound.volume(0, soundId);
          }, PAUSE_FADE_MS + 60);
        }

        function scheduleIdlePause() {
          if (idleTimer) {
            clearTimeout(idleTimer);
          }
          idleTimer = window.setTimeout(() => {
            idleTimer = 0;
            lastX = null;
            lastY = null;
            lastTime = null;
            pauseSound();
          }, IDLE_TIMEOUT);
        }

        function cancelScheduledPause() {
          if (idleTimer) {
            clearTimeout(idleTimer);
            idleTimer = 0;
          }
          if (pauseTimeout) {
            clearTimeout(pauseTimeout);
            pauseTimeout = 0;
          }
        }

        function applyVolume(target) {
          if (!audioStarted || soundId === null) {
            return;
          }
          const clamped = Math.min(MAX_VOLUME, Math.max(0, target));
          rippleSound.volume(clamped, soundId);
        }

        function handlePointerMove(event) {
          cancelScheduledPause();

          if (
            event.pointerType &&
            event.pointerType !== "mouse" &&
            event.pointerType !== "pen"
          ) {
            return;
          }

          if (!pointerTracking) {
            startAudio("pointer");
            return;
          }

          if (!audioStarted) {
            return;
          }

          if (!ensureSoundPlaying()) {
            return;
          }

          const now = performance.now();
          const currentX = event.clientX;
          const currentY = event.clientY;

          if (lastX === null) {
            lastX = currentX;
            lastY = currentY;
            lastTime = now;
            return;
          }

          const dx = currentX - lastX;
          const dy = currentY - lastY;
          const distance = Math.hypot(dx, dy);
          const elapsed = Math.max(1, now - lastTime);
          const speed = (distance / elapsed) * 1000; // px per second
          const targetVolume = speed * SPEED_TO_VOLUME;

          applyVolume(targetVolume);

          lastX = currentX;
          lastY = currentY;
          lastTime = now;
          scheduleIdlePause();
        }

        function resetPointerState() {
          lastX = null;
          lastY = null;
          lastTime = null;
        }

        function startAudio(trigger = "button") {
          if (audioStarted || startInProgress) {
            return;
          }

          startInProgress = true;

          if (trigger === "button" && enableButton) {
            enableButton.disabled = true;
            enableButton.textContent = "Loading ripple...";
          }

          const handlePlay = (id) => {
            rippleSound.off("play", handlePlay);
            rippleSound.off("playerror", handleError);
            soundId = id;
            pointerTracking = true;
            audioStarted = true;
            startInProgress = false;
            rippleSound.volume(0, soundId);
            hideEnableButton();
          };

          const handleError = (_id, error) => {
            rippleSound.off("play", handlePlay);
            rippleSound.off("playerror", handleError);
            console.error("Failed to play ripple audio:", error);
            pointerTracking = false;
            startInProgress = false;
            restoreEnableButton();
          };

          rippleSound.once("play", handlePlay);
          rippleSound.once("playerror", handleError);

          try {
            soundId = rippleSound.play();
          } catch (error) {
            handleError(null, error);
          }
        }

        rippleSound.on("loaderror", (_id, error) => {
          console.error("Ripple audio failed to load:", error);
          restoreEnableButton();
        });

        if (enableButton) {
          enableButton.addEventListener("click", () => startAudio("button"));
        }
        window.addEventListener("pointermove", handlePointerMove);
        window.addEventListener("mouseleave", () => {
          resetPointerState();
          pauseSound();
        });

        document.addEventListener("visibilitychange", () => {
          if (!audioStarted || soundId === null) {
            return;
          }
          if (document.hidden) {
            cancelScheduledPause();
            pauseSound();
          } else {
            ensureSoundPlaying();
          }
        });

        window.addEventListener("focus", ensureSoundPlaying);
      });
    </script>
    <!-- Voice capture -->
    <script>
      (function voiceCapture() {
        const $ = (s) => document.querySelector(s);
        const talkBtn = $("#talk");
        let talkHint = $("#talk-hint");
        let mindRedirectPending = false;
        
        // Mind Overlay Elements
        const mindOverlay = document.getElementById("mind-overlay");
        const returnWaterBtn = document.getElementById("return-water-btn");
        
        const mindVideos = [
            "images/dixitvideo_1.mp4",
            "images/dixitvideo_2.mp4",
            "images/dixitvideo_3.mp4",
            "images/dixitvideo_4.mp4",
            "images/dixitvideo_5.mp4",
        ];
        
        let userFirstWord = "";

        // Setup video looping logic
        const mindVideoEl = mindOverlay ? mindOverlay.querySelector("video") : null;
        let videoPlayCount = 0;

        if (mindVideoEl) {
            mindVideoEl.removeAttribute("loop"); 
            mindVideoEl.addEventListener("ended", () => {
                videoPlayCount++;
                if (videoPlayCount < 2) {
                    mindVideoEl.currentTime = 0;
                    mindVideoEl.play().catch(e => console.warn("Video replay failed:", e));
                }
            });
        }

        function showMindOverlay() {
            if (!mindOverlay) return;
            
            // Update caption with first word
            const captionEl = document.getElementById("mind-user-caption");
            if (captionEl && userFirstWord) {
                const name = userFirstWord.charAt(0).toUpperCase() + userFirstWord.slice(1);
                captionEl.textContent = `${name}'s Mind Space Now`;
            } else if (captionEl) {
                 captionEl.textContent = "Your Mind Space Now";
            }

            mindOverlay.classList.add("visible");
            mindOverlay.setAttribute("aria-hidden", "false");
            
            // Ensure video plays if it was paused or not started
            if (mindVideoEl) {
                videoPlayCount = 0; // Reset count on new show
                
                // Pick random video
                const randomVideo = mindVideos[Math.floor(Math.random() * mindVideos.length)];
                mindVideoEl.src = randomVideo;
                
                mindVideoEl.muted = false;
                mindVideoEl.currentTime = 0;
                mindVideoEl.play().catch(e => console.warn("Video play failed:", e));
            }
        }

        function hideMindOverlay() {
            if (!mindOverlay) return;
            
            // Reset UI state immediately so it looks right during fade out
            // Reset UI state immediately so it looks right during fade out
            recording = false;
            startPending = false;
            mindRedirectPending = false;
            userFirstWord = ""; // Reset captured word
            if (redirectTimeout) {
                clearTimeout(redirectTimeout);
                redirectTimeout = null;
            }
            refreshTalkHint();

            // Start fade out
            mindOverlay.classList.remove("visible");
            mindOverlay.setAttribute("aria-hidden", "true");
            
            // Reload page after transition to restore full initial state
            setTimeout(() => {
                window.location.reload();
            }, 2000);
        }

        if (returnWaterBtn) {
            returnWaterBtn.addEventListener("click", hideMindOverlay);
        }

        if (talkBtn) {
          talkBtn.style.display = "none";
          talkBtn.setAttribute("aria-hidden", "true");
          talkBtn.tabIndex = -1;
        }

        if (!talkHint) {
          talkHint = document.createElement("p");
          talkHint.id = "talk-hint";
          talkHint.textContent = "Double tap the water to talk.";
          talkHint.className = "sr-only";
          const anchor = talkBtn?.parentElement || document.body;
          anchor.appendChild(talkHint);
        } else {
          talkHint.classList.add("sr-only");
        }

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          if (talkBtn) {
            talkBtn.disabled = true;
            talkBtn.title = "Web Speech API not supported in this browser.";
          }
          if (talkHint) {
            talkHint.textContent =
              "Speech recognition is not supported in this browser.";
          }
          return;
        }

        const tapSurface = document.querySelector("#ripple") || document.body;
        const talkGlowBtn = document.getElementById("talk-glow-btn");
        let rec = null;
        let recording = false;
        let startPending = false;
        let redirectTimeout = null;

        const caption = document.getElementById("glow-orb-caption");

        function updateCaption(text) {
          if (!caption) return;
          if (caption.textContent.trim() === text) return;

          caption.classList.add("changing");
          setTimeout(() => {
            caption.textContent = text;
            caption.classList.remove("changing");
          }, 300);
        }

        function refreshTalkHint() {
          if (!talkHint) return;
          if (recording || startPending) {
            talkHint.textContent = "Listening... double tap again to stop.";
            updateCaption("I'm listening...");
          } else {
            talkHint.textContent = "Double tap the glowing orb or water to talk.";
            updateCaption("Double tap me, say your name and mood to reveal your mind space.");
          }
        }

        rec = new SR();
        rec.lang = "en-US";
        rec.interimResults = false;

        const DOUBLE_TAP_MS = 320;
        const doubleTapState = new WeakMap();

        function requestStart() {
          if (!rec) return;
          startPending = true;
          refreshTalkHint();
          try {
            rec.start();
          } catch (startError) {
            startPending = false;
            refreshTalkHint();
            if (startError.name !== "InvalidStateError") {
              console.warn("Speech start failed:", startError);
            }
          }
        }

        function requestStop() {
          if (!rec) return;
          startPending = false;
          refreshTalkHint();
          try {
            rec.stop();
          } catch (stopError) {
            if (stopError.name !== "InvalidStateError") {
              console.warn("Speech stop failed:", stopError);
            }
          }
        }

        function toggleRecognition() {
          if (recording || startPending) {
            requestStop();
          } else {
            requestStart();
          }
        }

        function resetDoubleTapState(target) {
          const state = doubleTapState.get(target);
          if (!state) {
            return;
          }
          window.clearTimeout(state.timeoutId);
          doubleTapState.delete(target);
        }

        function handlePointerDoubleTap(event) {
          const target = event.currentTarget || event.target;
          const now = Date.now();
          const state = doubleTapState.get(target);

          if (state && now - state.lastTapAt <= DOUBLE_TAP_MS) {
            resetDoubleTapState(target);
            event.preventDefault();
            event.stopPropagation();
            toggleRecognition();
            return;
          }

          resetDoubleTapState(target);
          const timeoutId = window.setTimeout(() => {
            doubleTapState.delete(target);
          }, DOUBLE_TAP_MS);

          doubleTapState.set(target, { lastTapAt: now, timeoutId });
        }

        [tapSurface, talkGlowBtn].forEach((target) => {
          if (!target) return;
          target.addEventListener("pointerdown", handlePointerDoubleTap, {
            passive: false,
          });
        });

        rec.onstart = () => {
          if (redirectTimeout) clearTimeout(redirectTimeout);
          recording = true;
          startPending = false;
          mindRedirectPending = false;
          refreshTalkHint();
        };

        rec.onend = () => {
          recording = false;
          startPending = false;
          
          if (mindRedirectPending) {
            // Wait 3s before showing the generating caption
            redirectTimeout = setTimeout(() => {
              updateCaption("Generating your mind space...");
              
              // Wait another 3s before showing the overlay
              redirectTimeout = setTimeout(() => {
                showMindOverlay();
              }, 3000);
            }, 3000);
          } else {
            refreshTalkHint();
          }
        };

        rec.onresult = (e) => {
          const transcript = e.results[0][0].transcript.trim();
          console.log("Speech transcript:", transcript);
          if (transcript) {
              userFirstWord = transcript.split(" ")[0];
          }
          mindRedirectPending = Boolean(transcript);
        };

        rec.onerror = (e) => {
          recording = false;
          startPending = false;
          mindRedirectPending = false;
          refreshTalkHint();
          alert("Speech error: " + e.error);
          console.warn("speech error:", e);
        };

        refreshTalkHint();
      })();
    </script>
    <script>
      (function setupTalkBowlReveal() {
        const prompt = document.getElementById("talk-bowl");
        if (!prompt) {
          return;
        }

        const MIN_DURATION_MS = 10000;
        const MAX_DURATION_MS = 30000; // 10s to 30s
        const STOP_THRESHOLD_MS = 400; // If no move for 400ms, continuous movement is broken

        let hasRevealed = false;
        let isMoving = false;
        let movementStartTime = 0;
        let requiredDuration = 0;
        let stopTimer = 0;

        function revealPrompt() {
          if (hasRevealed) {
            return;
          }

          hasRevealed = true;
          if (stopTimer) clearTimeout(stopTimer);

          prompt.setAttribute("data-state", "visible");
          prompt.removeAttribute("aria-hidden");
          document.removeEventListener("pointermove", handlePointerMove, true);
        }

        function handleStop() {
          isMoving = false;
          // Continuous movement broken; next move will restart timer with new random duration.
        }

        function handlePointerMove() {
          if (hasRevealed) {
            return;
          }

          const now = Date.now();

          // Reset the stop detector
          if (stopTimer) {
            clearTimeout(stopTimer);
          }

          // If starting a new movement segment
          if (!isMoving) {
            isMoving = true;
            movementStartTime = now;
            // Set a new random threshold for this run
            requiredDuration =
              MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
          }

          // Check elapsed time
          const elapsed = now - movementStartTime;
          if (elapsed >= requiredDuration) {
            revealPrompt();
            return;
          }

          // If no further event within threshold, consider it a stop
          stopTimer = setTimeout(handleStop, STOP_THRESHOLD_MS);
        }

        document.addEventListener("pointermove", handlePointerMove, {
          passive: true,
          capture: true,
        });
      })();
    </script>
    <script>
      (function initBioluminescentCursor() {
        const trailRoot = document.querySelector(".cursor-trail");
        if (!trailRoot || typeof window.matchMedia !== "function") {
          return;
        }

        const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        if (motionQuery.matches) {
          return;
        }

        const COLOR_PALETTE = [
          {
            core: "rgba(186, 235, 255, 0.95)",
            mid: "rgba(56, 189, 248, 0.5)",
            edge: "rgba(8, 26, 46, 0)",
            shadowStrong: "rgba(59, 130, 246, 0.8)",
            shadowSoft: "rgba(45, 212, 191, 0.5)",
          },
          {
            core: "rgba(129, 226, 231, 0.95)",
            mid: "rgba(16, 185, 129, 0.45)",
            edge: "rgba(3, 18, 40, 0)",
            shadowStrong: "rgba(20, 184, 166, 0.75)",
            shadowSoft: "rgba(59, 130, 246, 0.4)",
          },
          {
            core: "rgba(147, 197, 253, 0.95)",
            mid: "rgba(59, 130, 246, 0.45)",
            edge: "rgba(15, 23, 42, 0)",
            shadowStrong: "rgba(67, 56, 202, 0.8)",
            shadowSoft: "rgba(56, 189, 248, 0.45)",
          },
          {
            core: "rgba(106, 213, 255, 0.9)",
            mid: "rgba(14, 165, 233, 0.45)",
            edge: "rgba(2, 8, 23, 0)",
            shadowStrong: "rgba(37, 99, 235, 0.75)",
            shadowSoft: "rgba(14, 165, 233, 0.4)",
          },
        ];

        document.body.classList.add("is-cursor-hidden");

        const MAX_PARTICLES = 80;
        const MIN_FRAME_GAP = 12;
        let lastStamp = 0;

        function trimParticles() {
          while (trailRoot.children.length > MAX_PARTICLES) {
            trailRoot.removeChild(trailRoot.firstChild);
          }
        }

        function createParticle(x, y, energy) {
          const palette =
            COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
          const size = 18 + Math.random() * 18 * energy;
          const duration = 950 + Math.random() * 550;

          const particle = document.createElement("span");
          particle.className = "cursor-trail__particle";
          particle.style.setProperty("--x", `${x}px`);
          particle.style.setProperty("--y", `${y}px`);
          particle.style.setProperty("--size", `${size.toFixed(1)}px`);
          particle.style.setProperty("--duration", `${duration.toFixed(0)}ms`);
          particle.style.setProperty("--glow-core", palette.core);
          particle.style.setProperty("--glow-mid", palette.mid);
          particle.style.setProperty("--glow-edge", palette.edge);
          particle.style.setProperty("--glow-shadow-strong", palette.shadowStrong);
          particle.style.setProperty("--glow-shadow-soft", palette.shadowSoft);

          trailRoot.appendChild(particle);
          trimParticles();

          window.setTimeout(() => {
            particle.remove();
          }, duration + 120);
        }

        function spawnBurst(event, extraEnergy) {
          const baseEnergy = Math.max(event.pressure || 0.35, 0.35) + extraEnergy;
          const count = Math.ceil(baseEnergy * 3);

          for (let i = 0; i < count; i++) {
            const radius = Math.random() * (18 + extraEnergy * 14);
            const theta = Math.random() * Math.PI * 2;
            const x = event.clientX + Math.cos(theta) * radius;
            const y = event.clientY + Math.sin(theta) * radius;
            createParticle(x, y, baseEnergy);
          }
        }

        function handlePointerMove(event) {
          if (event.pointerType === "touch") {
            return;
          }

          const now = performance.now();
          if (now - lastStamp < MIN_FRAME_GAP) {
            return;
          }

          lastStamp = now;
          spawnBurst(event, 0);
        }

        function handlePointerDown(event) {
          if (event.pointerType === "touch") {
            return;
          }

          spawnBurst(event, 1);
        }

        function resetTrail() {
          trailRoot.replaceChildren();
        }

        window.addEventListener("pointermove", handlePointerMove, {
          passive: true,
        });
        window.addEventListener("pointerdown", handlePointerDown, {
          passive: true,
        });
        window.addEventListener("pointerleave", resetTrail, { passive: true });
        window.addEventListener("blur", resetTrail);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            resetTrail();
          }
        });

        const handleMotionChange = (event) => {
          if (!event.matches) {
            return;
          }

          document.body.classList.remove("is-cursor-hidden");
          window.removeEventListener("pointermove", handlePointerMove);
          window.removeEventListener("pointerdown", handlePointerDown);
          window.removeEventListener("pointerleave", resetTrail);
          window.removeEventListener("blur", resetTrail);
          resetTrail();
        };

        if (typeof motionQuery.addEventListener === "function") {
          motionQuery.addEventListener("change", handleMotionChange);
        } else if (typeof motionQuery.addListener === "function") {
          motionQuery.addListener(handleMotionChange);
        }
      })();
    </script>
  </body>
</html>
